<style>:root {

  --ink: #18181b; --ink2: #3f3f46; --muted: #5f5f66; --faint: #6b6b73;

.app { min-height: 100vh; display: flex; flex-direction: column; }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; padding: 12px 24px; background: var(--panel); border-bottom: 1px solid var(--line); }

/* website: open a proof */

/* segmented controls */

/* nav */
.modes { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 8px 20px; background: var(--panel); border-bottom: 1px solid var(--line); }
.tab { display: inline-flex; align-items: center; gap: 8px; min-height: 38px; padding: 0 12px; border-radius: 8px; color: var(--ink2); text-decoration: none; font-weight: 500; border: 0; background: transparent; font-size: 14px; }

.tab.on .badge { background: #3a3a40; color: #fff; }
.comparebox { display: inline-flex; align-items: center; gap: 8px; min-height: 34px; padding: 0 10px 0 0; font-size: 14px; font-weight: 600; color: var(--ink); cursor: pointer; }
.comparebox input { width: 16px; height: 16px; margin: 0; accent-color: var(--prev); }
.modes .select, .subbar .select { min-height: 34px; }

/* toolbars */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; padding: 10px 24px; background: var(--panel2); border-bottom: 1px solid var(--line); }
.toolbar .lbl { font-size: 12px; font-weight: 600; color: var(--muted); }
.field { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: var(--muted); }

.btn { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid #d6d6d0; background: #fff; color: var(--ink); text-decoration: none; font-size: 13px; font-weight: 600; }
.btn:hover { background: var(--chip); color: var(--ink); }
.btn.primary { border: 0; background: var(--ink); color: #fff; }
.btn.primary:hover { background: #2f2f35; color: #fff; }

.btn.sm { min-height: 32px; padding: 0 10px; font-size: 12px; }
.pager { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }

/* layout */
.body { display: flex; flex-wrap: wrap; flex: 1; align-items: stretch; }
.main { flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; background: var(--panel); }
.side { flex: 1 1 300px; max-width: 100%; background: var(--panel2); border-left: 1px solid var(--line); padding: 18px 20px 24px; display: flex; flex-direction: column; gap: 20px; }

.list { flex: 1 1 290px; max-width: 100%; align-self: flex-start; background: var(--panel); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; }
/* sticky only while list, stage and side panel sit side by side; stacked, it would cover the panel */
@media (min-width: 1180px) { .list { position: sticky; top: 0; } }
.list .rows { max-height: calc(100vh - 210px); min-height: 240px; overflow-y: auto; }
.list .head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 14px 16px 10px; border-bottom: 1px solid var(--line2); }
.list .foot { margin-top: auto; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line2); }

section.blk { display: flex; flex-direction: column; gap: 8px; }

/* text field */
.textfield { padding: 16px 28px 0; display: flex; flex-direction: column; gap: 6px; }
.textfield label { font-size: 12px; font-weight: 600; color: var(--ink2); }
.textfield textarea { resize: vertical; width: 100%; padding: 8px 12px; border: 1px solid #d6d6d0; border-radius: 8px; font-size: 16px; line-height: 1.35; }

.dot { display: inline-block; width: 12px; height: 12px; border-radius: 999px; }

/* glyph runs */
.run { position: relative; flex: 0 0 auto; align-self: flex-start; }
.run svg { position: absolute; left: 0; overflow: visible; }
.gapbtn { position: absolute; padding: 0; border: 0; border-radius: 5px; background: transparent; }
.gapbtn:hover { background: rgba(24,24,27,.10); }
.gapbtn[aria-pressed="true"] { background: rgba(29,78,216,.16); box-shadow: inset 0 0 0 1.5px var(--blue); }
.pin { position: absolute; transform: translate(-50%, -55%); min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; border: 2px solid #fff; color: #fff; font-size: 11px; font-weight: 700; line-height: 18px; text-align: center; pointer-events: none; white-space: nowrap; }
.lab { position: absolute; transform: translateX(-50%); font-family: var(--mono); font-feature-settings: var(--mono-features); font-size: 11px; font-weight: 600; line-height: 1; padding: 3px 5px; border-radius: 4px; pointer-events: none; white-space: nowrap; border: 1px solid transparent; }

.emptystate b { color: var(--ink); font-weight: 600; }
.iconbtn { flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); }
.iconbtn:hover { background: var(--chip); color: var(--ink); }

/* inspector */
.pairhead { display: flex; align-items: center; gap: 14px; }
.pairpic { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: baseline; column-gap: 14px; padding-top: 6px; }
.pairpic .run { align-self: baseline; font-size: 0; line-height: 0; }
.pairpic .strut { display: inline-block; width: 0; vertical-align: baseline; }

.pairpic .grp.l { text-align: right; }

.pairhead h2 { font-size: 17px; font-weight: 600; }
.cells { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px; background: #fff; overflow: hidden; }
.cell { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 6px 12px; border-bottom: 1px solid var(--line2); }
.cell:last-child { border-bottom: 0; background: #f7f7f4; }
.cell .op { width: 14px; font-family: var(--mono); font-feature-settings: var(--mono-features); color: var(--faint); }
.cell .what { flex: 1; display: flex; flex-direction: column; font-size: 13px; }
.cell .what small { font-size: 11px; color: var(--muted); }
.cell .val { font-family: var(--mono); font-feature-settings: var(--mono-features); font-size: 15px; }
.cell .was { font-family: var(--mono); font-feature-settings: var(--mono-features); font-size: 12px; color: var(--muted); text-decoration: line-through; }
.sug { font-family: var(--mono); font-feature-settings: var(--mono-features); font-size: 12px; font-weight: 600; padding: 1px 6px; border-radius: 999px; border: 1px dashed var(--blue); color: var(--blue); white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 999px; background: #fff; border: 1px solid var(--line); font-size: 12px; font-weight: 500; }
.chip .dot { width: 8px; height: 8px; }
.typechip { display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 10px; border-radius: 999px; border: 1px solid #d6d6d0; background: #fff; color: var(--ink2); font-size: 12px; font-weight: 600; }
.typechip .dot { width: 8px; height: 8px; }
.box { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 12px; border-radius: 10px; background: #fff; border: 1px solid var(--line); }
.stepper { display: inline-flex; align-items: center; border: 1px solid #d6d6d0; border-radius: 8px; overflow: hidden; background: #fff; }
.stepper button { width: 40px; min-height: 36px; border: 0; background: #fff; font-family: var(--mono); font-feature-settings: var(--mono-features); font-size: 15px; }
.stepper button:hover { background: var(--chip); }
.stepper input { width: 64px; min-height: 36px; padding: 0 4px; border: 0; border-left: 1px solid #e6e6e0; border-right: 1px solid #e6e6e0; text-align: center; font-family: var(--mono); font-feature-settings: var(--mono-features); font-size: 14px; font-weight: 600; background: #fff; }
.stepper input:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
textarea.note { resize: vertical; min-height: 64px; padding: 8px 10px; border: 1px solid #d6d6d0; border-radius: 6px; font-size: 13px; line-height: 1.4; width: 100%; }
.thread { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-radius: 10px; background: #fff; border: 1px solid var(--line); }
.thread .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }

.num { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 999px; color: #fff; font-size: 11px; font-weight: 700; }
.tchip { font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; }
.reply { margin-left: 10px; padding-left: 10px; border-left: 2px solid var(--line); font-size: 12px; color: var(--ink2); }
.reply b { font-weight: 600; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--muted); font-size: 11px; text-decoration: underline; }

/* lists of pairs */
.rows { display: flex; flex-direction: column; }
.prow { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 58px; padding: 8px 16px; border: 0; border-bottom: 1px solid var(--line2); background: #fff; text-align: left; }
.prow:hover { filter: brightness(.975); }
.prow[aria-pressed="true"] { background: var(--sel); }
.prow .g { flex: 0 0 auto; min-width: 54px; }
.prow .t { display: flex; flex-direction: column; flex: 1; min-width: 0; gap: 2px; }
.prow .t b { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prow .t span { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font-size: 11px; font-weight: 600; padding: 0 6px; border-radius: 4px; color: var(--ink2); background: var(--chip); }
.tag.kon { color: #9a3412; background: #fff1e3; }
.tag.warn { color: #8a4b00; background: #fff1d6; }
.pill { flex: 0 0 auto; font-family: var(--mono); font-feature-settings: var(--mono-features); font-size: 13px; font-weight: 600; padding: 3px 9px; border-radius: 999px; }
.more { margin: 10px 16px; }

/* changes */
.subbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 24px; padding: 8px 24px; background: var(--panel2); border-bottom: 1px solid var(--line); }
.subbar.on { background: #effaf8; border-bottom-color: #cdebe6; }
.subbar .opts { display: contents; }
.subbar .opts:disabled > * { opacity: .4; }
.subbar .opts:disabled * { cursor: default; }
.subbar .seg button { gap: 4px; padding: 0 6px; min-height: 28px; font-size: 12.5px; }
.subbar .check { font-size: 12.5px; gap: 6px; }
.subbar .btn { min-height: 34px; font-size: 12.5px; }
.subbar .l { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; }
.stagehead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; padding: 18px 28px 14px; }
.stagehead .k { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.stagehead h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
.stagehead h1 span { font-weight: 400; color: var(--muted); }
.ctxbtn { min-height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid #d6d6d0; background: #fff; display: inline-flex; align-items: center; }
/* runs default to the top (proof lines); centre them inside boxes */
.ctxbtn .run, .btn .run, .gchip .run, .gcard .pic .run { align-self: center; }
.ctxbtn[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.stage { flex: 1; min-height: 360px; display: flex; flex-direction: column; justify-content: center; gap: 18px; padding: 24px 28px 36px; overflow-x: auto; border-top: 1px solid var(--line2); }
.formula { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 0; padding: 16px 20px 20px; border-top: 1px solid var(--line2); background: var(--panel2); }
.fcell { display: flex; flex-direction: column; gap: 2px; min-width: 150px; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--line); background: #fff; }
.fcell.strong { border-color: var(--ink); }
.fop { padding: 0 10px; font-family: var(--mono); font-feature-settings: var(--mono-features); font-size: 18px; color: var(--faint); }
.gchips { display: flex; flex-wrap: wrap; gap: 4px; }
.gchip { min-width: 30px; height: 32px; padding: 0 4px; display: inline-flex; align-items: center; justify-content: center; border-radius: 6px; border: 1.5px solid #dcdcd6; background: #fff; }
.gchip.key { border-color: var(--ink); }
.gchip.exc { border-color: #e8a463; background: #fff4e6; }
.warnbox { display: flex; gap: 10px; padding: 10px 12px; border-radius: 8px; background: #fff4e6; border: 1px solid #f0c595; font-size: 12px; color: #431407; }
kbd { font-family: var(--mono); font-feature-settings: var(--mono-features); font-size: 12px; padding: 1px 6px; border-radius: 4px; border: 1px solid #c9c9c3; }

/* glyph cards */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.gcard { display: flex; flex-direction: column; gap: 8px; padding: 0 0 12px; border-radius: 12px; border: 1.5px solid var(--line); background: #fff; text-align: left; overflow: hidden; }
.gcard[aria-pressed="true"] { border-color: var(--ink); }
.gcard .pic { height: 150px; display: flex; align-items: center; justify-content: center; background: #fbfbf9; border-bottom: 1px solid var(--line2); }
.gcard .nm { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 0 14px; }
.gcard .rows2 { display: flex; flex-direction: column; gap: 4px; padding: 0 14px; font-family: var(--mono); font-feature-settings: var(--mono-features); font-size: 12px; }
.gcard .rows2 > span { display: flex; align-items: center; gap: 8px; }
.gcard .rows2 .k { width: 42px; font-family: var(--sans); font-feature-settings: var(--sans-features); font-weight: 500; color: var(--muted); }
.strbox { padding: 6px 12px 4px; border-radius: 10px; border: 1px solid var(--line2); overflow-x: auto; }

/* shapes */
.glyphbtn { position: absolute; padding: 0; border: 0; border-radius: 5px; background: transparent; }
.glyphbtn:hover { background: rgba(24,24,27,.05); }
.glyphbtn[aria-pressed="true"] { background: rgba(220,38,38,.07); box-shadow: inset 0 0 0 1.5px #dc2626; }
.pin.glyph { border-radius: 6px; }
.glyphsvg { display: block; width: 100%; overflow: hidden; }
.glyphsvg.small { height: 240px; }
.glyphsvg.big { height: clamp(260px, calc(100vh - 430px), 640px); }
.glyphsvg.mini { width: 118px; height: 118px; }
.glyphsvg.thumb { flex: 0 0 auto; width: 42px; height: 44px; }
.glyphsvg.edit { cursor: crosshair; touch-action: none; user-select: none; -webkit-user-select: none; }
.glyphsvg .halo, .glyphsvg .pen { vector-effect: non-scaling-stroke; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
.glyphsvg .halo { stroke-width: 16px; opacity: .45; }
.glyphsvg .pen { stroke-width: 3px; }
.glyphsvg.mini .pen { stroke-width: 2px; }
.markpin { pointer-events: none; }
.markpin text { font-family: var(--sans); font-feature-settings: var(--sans-features); font-size: 11px; font-weight: 700; }
.pad { position: relative; min-width: 0; }
.side .pad { border: 1px solid var(--line); border-radius: 10px; background: #fff; overflow: hidden; }
.glyphhead { display: flex; align-items: center; gap: 8px; min-width: 0; }
.glyphhead h2 { min-width: 0; overflow: hidden; text-overflow: ellipsis; font-size: 17px; font-weight: 600; }
.glyphhead .spacer { flex-basis: 0; }
.changebtn, .pill.delta { color: #7a4b00; background: #fdf0d3; }
.changebtn { border: 0; border-radius: 999px; padding: 2px 9px; font-family: var(--mono); font-feature-settings: var(--mono-features); font-size: 12px; font-weight: 600; }
.formfoot { display: flex; align-items: center; gap: 8px; }
.tchip.since { color: #115e59; background: #dff5f1; }
.list .head.kinds { padding: 10px 12px; }
.list .kinds .seg button { padding: 0 8px; min-height: 28px; font-size: 12.5px; }
.stage.shape { flex: 0 0 auto; min-height: 0; justify-content: flex-start; gap: 10px; padding: 16px 28px; }
.sides { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 16px; }
.shapelegend { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 12px; color: var(--ink2); }
.shapelegend .item { display: inline-flex; align-items: center; gap: 6px; }
.shapectx { display: flex; flex-wrap: wrap; gap: 4px 36px; padding: 14px 28px 18px; border-top: 1px solid var(--line2); background: var(--panel2); overflow-x: auto; }
.pill-btn { min-height: 30px; padding: 0 12px; border-radius: 999px; font-size: 12px; }
.pill-btn[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
button.gchip { cursor: pointer; }
.notefigs { display: flex; flex-wrap: wrap; gap: 12px; }
.notefig { margin: 0; display: flex; flex-direction: column; gap: 4px; }

/* notes */
.ncard { display: flex; flex-wrap: wrap; gap: 14px 20px; padding: 16px 18px; border-radius: 12px; background: #fff; border: 1px solid var(--line); }
.ncard.res, .thread.res { background: var(--panel2); }
.ncard.res .lft { opacity: .5; }
.ncard.res .rgt p, .thread.res p { color: var(--muted); }
.tchip.resolved { color: #166534; background: #e7f6ec; }
.ncard .lft { flex: 0 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.ncard .rgt { flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.ncard .rgt p { margin: 0; font-size: 14px; }
.nmeta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.nline { display: flex; align-items: center; gap: 10px; }
.nline > span { flex: 0 0 64px; font-size: 11px; font-weight: 600; }
pre.export { margin: 0; max-height: 480px; overflow: auto; padding: 14px 16px; border-radius: 10px; background: var(--ink); color: var(--bg); font-family: var(--mono); font-feature-settings: var(--mono-features); font-size: 12px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
.empty { margin: 0; font-size: 13px; color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13px; box-shadow: 0 6px 24px rgba(0,0,0,.2); }

@media print {
  .top, .modes, .toolbar, .side, .btn, .linkbtn { display: none !important; }
  body, .app, .main { background: #fff; }
  .ncard { break-inside: avoid; }
}

<style>/* Website only (tools/build.py --site). The plug-in and standalone HTML proofs keep
   system fonts: they have to work offline and must not carry a font file.

   The font is the main site's file, which needs to be 2.011 or later: that's where
   ss05 includes tabular figures and U+0394, used in the delta labels, is mapped. */
@font-face {
  font-family: "Fizz";
  src: url("/assets/fonts/FizzVF-Regular.woff2") format("woff2");
  font-weight: 200 1000;
  font-display: swap;
}

:root {
  --sans: "Fizz", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "Fizz", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans-features: normal;
  /* ss05 makes figures tabular but leaves them oldstyle: lnum makes them lining, at
     the same 580 units as + and −, so values line up. */
  --mono-features: "ss05", "lnum";
}

/* oldstyle figures sit off-centre in the numbered circles */
.pin, .num, .markpin text { font-feature-settings: "lnum"; }
</style>

<script>/* rednotes engine: data model, text layout, kerning resolution, diffs and

(function (global) {

    'collision': { label: 'Collision', fg: '#b42318', bg: '#fdecea', pin: '#b91c1c', sug: 10 },
    'question': { label: 'Question', fg: '#5b21b6', bg: '#efe9fc', pin: '#6d28d9', sug: 0 },
    'looks-good': { label: 'Looks good', fg: '#166534', bg: '#e6f4ea', pin: '#15803d', sug: 0 },
    'too-heavy': { label: 'Too heavy', fg: '#78350f', bg: '#f5e9df', pin: '#78350f', sug: 0 },
    'too-light': { label: 'Too light', fg: '#075985', bg: '#e0f2fe', pin: '#0369a1', sug: 0 },

    function App() {

    /**

      if (e.key === '2') { S.cmp.showPrev = true; render(); }
