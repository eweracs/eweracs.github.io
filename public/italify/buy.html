<!-- Set the theme before first paint to avoid a flash of the wrong mode:
     stored choice wins, otherwise follow the OS preference. -->
<script>
(function () {
	try {
		var stored = localStorage.getItem("italify-theme");
		var theme = stored || (window.matchMedia &&
			window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
		document.documentElement.setAttribute("data-theme", theme);
	} catch (e) {}
})();
</script>

<style>
	/* The Buy page, in the landing page's wide layout (styles.css,

<script>
// FAQ: each question folds into a disclosure. The section stays ordinary
// `####` headings and paragraphs in content/buy.md – this only refolds
// what main.js rendered, so editing the answers is still editing
// Markdown.
document.addEventListener("italify:rendered", function () {
	var faq = document.querySelector('section[data-section="faq"]');
	var body = faq && faq.querySelector(".section-body");
	if (!body) return;
	body.classList.add("faq-list");
	// Either heading level – the questions are `####` in the Markdown, and
	// changing that should not silently unfold the section.
	Array.prototype.forEach.call(body.querySelectorAll("h3, h4"), function (heading) {
		var item = document.createElement("details");
		item.className = "faq-item";
		heading.parentNode.insertBefore(item, heading);
		var summary = document.createElement("summary");
		summary.className = "faq-question";
		summary.appendChild(heading);
		item.appendChild(summary);
		// Everything up to the next question is this question's answer.
		var answer = document.createElement("div");
		answer.className = "faq-answer";
		while (item.nextSibling && !/^H[34]$/.test(item.nextSibling.tagName || "")) {
			answer.appendChild(item.nextSibling);
		}
		item.appendChild(answer);
	});
});

// The order. Every markup block arrives with the rendered Markdown
// (content/buy.md), so all of this hooks up after main.js dispatches
// italify:rendered.
//
// Prices are NOT duplicated here: the catalog is read out of the two
// pricing tables in content/buy.md (kept in the page, hidden), which
// keeps the tables and the order from ever disagreeing. It is
// display-only regardless – the Worker holds its own catalog and
// recomputes every price server-side, ignoring whatever the client
// claims (Scripts/TrialWorker/src/index.mjs).
// Local previews talk to the STAGING Worker (its own KV namespace and
// the Stripe SANDBOX keys – see wrangler.toml [env.staging]), so the
// whole flow can be exercised without touching live data. The published
// page talks to production.
var WORKER_URL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname)
	? "https://italify-trial-staging.file-manager-bot.workers.dev"
	: "https://italify-trial.file-manager-bot.workers.dev";

// The organisation sizes, matched against the pricing tables' column
// headings. A key is also the first half of the package key the Worker
// validates: `thin-4`, `bold-month`.
var SIZES = ["thin", "light", "medium", "bold"];

// The time-pass rows, keyed by their label in the pricing table; the slug
// completes the package key. A pass with `renews` can renew
// automatically: ticked, the order goes to the Worker as
// `<size>-<renews>` (a subscription at the same price, charged `per`).
var PASSES = {
	"one week": { slug: "week", label: "One week" },
	"two weeks": { slug: "2weeks", label: "Two weeks" },
	"one month": { slug: "month", label: "One month", renews: "monthly", per: "month" },
	"one year": { slug: "year", label: "One year", renews: "yearly", per: "year" },
};
// The pass the page falls back to when the chosen one isn't on offer for
// the chosen size.
var DEFAULT_PASS = "month";

// Seats: the first at the package price, every further one at 20 % of
// it. The Worker recomputes the same figure from the package key and the
// seat count, so this is display only.
var EXTRA_SEAT_FACTOR = 0.2;
var MAX_SEATS = 10;

// "1 000 €" – space as the thousands separator, as everywhere on the page.
function euros(value) {
	return String(Math.round(value)).replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " €";
}

// The number in a table cell, or null if there isn't one (a dash in the
// pass table means that size cannot buy that pass).
function amount(text) {
	var digits = String(text == null ? "" : text).replace(/[^\d]/g, "");
	return digits ? Number(digits) : null;
}

// A row of role="radio" cards: click to choose, arrows move the choice
// (skipping disabled cards), only the chosen card is a tab stop.
function radioGroup(container, selector, onPick) {
	function cards() {
		return Array.prototype.filter.call(container.querySelectorAll(selector), function (card) {
			return !card.disabled;
		});
	}
	container.addEventListener("click", function (event) {
		var card = event.target.closest(selector);
		if (card && !card.disabled) onPick(card);
	});
	container.addEventListener("keydown", function (event) {
		var card = event.target.closest(selector);
		if (!card) return;
		var back = event.key === "ArrowLeft" || event.key === "ArrowUp";
		var forward = event.key === "ArrowRight" || event.key === "ArrowDown";
		if (!back && !forward) return;
		event.preventDefault();
		var list = cards();
		var next = list[(list.indexOf(card) + (back ? -1 : 1) + list.length) % list.length];
		if (!next) return;
		onPick(next);
		next.focus();
	});
}

function markChosen(container, selector, isChosen) {
	Array.prototype.forEach.call(container.querySelectorAll(selector), function (card) {
		var chosen = isChosen(card);
		card.setAttribute("aria-checked", chosen ? "true" : "false");
		card.tabIndex = chosen ? 0 : -1;
	});
}

document.addEventListener("italify:rendered", function () {
	var main = document.querySelector("main[data-source]");
	var form = document.getElementById("order-form");
	if (!main || !form) return;
	function section(id) {
		return main.querySelector('section[data-section="' + id + '"]');
	}

	// ---- Layout ------------------------------------------------------
	// The first section (title, lede, trial button) is the intro band;
	// the order steps go into a two-column shop with the summary beside
	// them. Everything stays in the order content/buy.md gives it.
	var intro = main.querySelector("section:first-child");
	if (intro && !intro.dataset.section) intro.classList.add("buy-intro");
	var STEP_IDS = ["size", "licence", "credits", "time", "seats", "order"];
	var steps = STEP_IDS.map(section);
	var shop = document.createElement("div");
	shop.className = "shop";
	var stepColumn = document.createElement("div");
	stepColumn.className = "shop-steps";
	if (steps[0]) steps[0].parentNode.insertBefore(shop, steps[0]);
	shop.appendChild(stepColumn);
	steps.forEach(function (step) { if (step) stepColumn.appendChild(step); });
	var summary = document.getElementById("order-summary");
	if (summary) shop.appendChild(summary);

	// ---- Elements -----------------------------------------------------
	var sizePicker = document.getElementById("size-picker");
	var kindPicker = document.getElementById("kind-picker");
	var renewRow = document.getElementById("order-renew-row");
	var renewBox = document.getElementById("order-renew");
	var renewUnit = document.getElementById("renew-unit");
	var renewNote = document.getElementById("renew-note");
	var renewUnavailable = document.getElementById("renew-unavailable");
	var seatsDown = document.getElementById("seats-down");
	var seatsUp = document.getElementById("seats-up");
	var seatsValue = document.getElementById("seats-value");
	var country = document.getElementById("order-country");
	var vatRow = document.getElementById("order-vat-row");
	var vatInput = document.getElementById("order-vat");
	var topupBox = document.getElementById("order-topup");
	var licenceInput = document.getElementById("order-licence");
	var licenceNote = document.getElementById("order-licence-note");
	var licenceNoteHTML = licenceNote ? licenceNote.innerHTML : "";
	var total = document.getElementById("order-total");
	var submit = document.getElementById("order-submit");
	var status = document.getElementById("order-status");
	var statusText = status ? status.textContent : "";
	var sumSize = document.getElementById("sum-size");
	var sumPackage = document.getElementById("sum-package");
	var sumSeats = document.getElementById("sum-seats");
	var sumRenewRow = document.getElementById("sum-renew-row");
	var sumRenew = document.getElementById("sum-renew");

	// ---- The catalog, read off the tables --------------------------------
	function tableIn(id) {
		var s = section(id);
		var table = s ? s.querySelector("table") : null;
		if (table) table.classList.add("price-source");
		return table;
	}
	var creditTable = tableIn("credits");
	var passTable = tableIn("time");

	function bodyRows(table) {
		return table ? Array.prototype.slice.call(table.querySelectorAll("tbody tr")) : [];
	}
	// Which column holds which size, read from the table's own headings.
	function columnsOf(table) {
		var map = {};
		if (!table) return map;
		Array.prototype.forEach.call(table.querySelectorAll("thead th"), function (th, index) {
			var key = th.textContent.trim().toLowerCase();
			if (SIZES.indexOf(key) !== -1) map[key] = { index: index, name: th.textContent.trim() };
		});
		return map;
	}
	function priceIn(row, column) {
		if (!column) return null;
		var cell = row.children[column.index];
		return cell ? amount(cell.textContent) : null;
	}

	// Credit packs: [{ n, prices: { thin: 50, … } }], in table order.
	var creditColumns = columnsOf(creditTable);
	var packs = bodyRows(creditTable).map(function (row) {
		var n = amount(row.children[0].textContent);
		var prices = {};
		SIZES.forEach(function (key) { prices[key] = priceIn(row, creditColumns[key]); });
		return { n: n, prices: prices };
	}).filter(function (pack) { return pack.n; });

	// Passes: [{ slug, label, renews, per, prices, offeredBy }].
	var passColumns = columnsOf(passTable);
	var passes = bodyRows(passTable).map(function (row) {
		var pass = PASSES[row.children[0].textContent.trim().toLowerCase()];
		if (!pass) return null;
		var prices = {};
		SIZES.forEach(function (key) { prices[key] = priceIn(row, passColumns[key]); });
		return {
			slug: pass.slug, label: pass.label, renews: pass.renews || null, per: pass.per || null,
			prices: prices,
			// Where a size can't buy it, the card says where it can be had,
			// naming the sizes as the table's headings do.
			offeredBy: SIZES.filter(function (key) { return prices[key] !== null; })
				.map(function (key) { return passColumns[key].name; }),
		};
	}).filter(Boolean);

	// ---- State ----------------------------------------------------------
	var size = SIZES[0];
	var kind = "credits"; // or "time" – the id of the section on show
	var packIndex = 0;
	var passSlug = DEFAULT_PASS;
	var seats = 1;
	// The licence a top-up is for, as the Worker described it
	// (/licence/lookup): { key, seats, renews }. Null for a new licence.
	var topUp = null;

	// ---- Credit slider ------------------------------------------------------
	var creditSection = section("credits");
	var slider = null, ticks = [], readout = {};
	if (creditSection && packs.length) {
		var lo = packs[0].n, hi = packs[packs.length - 1].n;
		function frac(n) { return hi === lo ? 0 : (n - lo) / (hi - lo); }
		function position(n) { return "calc(12px + (100% - 24px) * " + frac(n).toFixed(4) + ")"; }
		var picker = document.createElement("div");
		picker.className = "credit-picker";
		slider = document.createElement("input");
		slider.type = "range";
		slider.className = "credit-range";
		slider.min = lo;
		slider.max = hi;
		slider.step = 1;
		slider.setAttribute("aria-label", "Number of master credits");
		picker.appendChild(slider);
		var tickRow = document.createElement("div");
		tickRow.className = "credit-ticks";
		ticks = packs.map(function (pack, index) {
			var tick = document.createElement("button");
			tick.type = "button";
			tick.className = "credit-tick";
			tick.textContent = pack.n;
			tick.style.left = position(pack.n);
			tick.tabIndex = -1; // the slider is the keyboard control
			tick.addEventListener("click", function () { packIndex = index; update(); });
			tickRow.appendChild(tick);
			return tick;
		});
		picker.appendChild(tickRow);
		var box = document.createElement("div");
		box.className = "credit-readout";
		box.innerHTML = '<div><p class="readout-name"></p><p class="readout-sub"></p></div><p class="readout-price"></p>';
		readout = {
			name: box.querySelector(".readout-name"),
			sub: box.querySelector(".readout-sub"),
			price: box.querySelector(".readout-price"),
		};
		picker.appendChild(box);
		// After the step's one-line hint.
		var hint = creditSection.querySelector(".section-body > p");
		if (hint) hint.parentNode.insertBefore(picker, hint.nextSibling);
		else creditSection.appendChild(picker);
		slider.position = position;
		// Any slider value snaps to the nearest pack.
		slider.addEventListener("input", function () {
			var value = Number(slider.value);
			var best = 0;
			packs.forEach(function (pack, index) {
				if (Math.abs(pack.n - value) < Math.abs(packs[best].n - value)) best = index;
			});
			packIndex = best;
			update();
		});
	}

	// ---- Pass cards ------------------------------------------------------------
	var timeSection = section("time");
	var passGrid = null;
	if (timeSection && passes.length) {
		passGrid = document.createElement("div");
		passGrid.className = "choice-grid pass-picker";
		passGrid.setAttribute("role", "radiogroup");
		passGrid.setAttribute("aria-label", "Time pass");
		passes.forEach(function (pass) {
			var card = document.createElement("button");
			card.type = "button";
			card.className = "choice-card pass-option";
			card.dataset.pass = pass.slug;
			card.setAttribute("role", "radio");
			card.innerHTML = '<span class="choice-name"></span><span class="choice-price"></span>';
			card.querySelector(".choice-name").textContent = pass.label;
			passGrid.appendChild(card);
		});
		var passHint = timeSection.querySelector(".section-body > p");
		if (passHint) passHint.parentNode.insertBefore(passGrid, passHint.nextSibling);
		else timeSection.appendChild(passGrid);
		radioGroup(passGrid, ".pass-option", function (card) { passSlug = card.dataset.pass; update(); });
	}

	// ---- Pickers -----------------------------------------------------------------
	if (sizePicker) radioGroup(sizePicker, ".size-option", function (card) { size = card.dataset.size; update(); });
	if (kindPicker) radioGroup(kindPicker, ".kind-option", function (card) { kind = card.dataset.kind; update(); });
	if (renewBox) renewBox.addEventListener("change", update);
	if (seatsDown) seatsDown.addEventListener("click", function () { seats = Math.max(1, seats - 1); update(); });
	if (seatsUp) seatsUp.addEventListener("click", function () { seats = Math.min(MAX_SEATS, seats + 1); update(); });

	// ---- Pricing -------------------------------------------------------------------
	function passFor(slug) {
		return passes.filter(function (pass) { return pass.slug === slug; })[0] || null;
	}
	// The pass actually on order: the chosen one, or – where the size
	// can't buy it – the default.
	function currentPass() {
		var pass = passFor(passSlug);
		if (pass && pass.prices[size] !== null) return pass;
		return passFor(DEFAULT_PASS);
	}
	function seatsChosen() {
		// A top-up is priced for its licence's seats – the Worker does the same.
		return topUp ? topUp.seats : seats;
	}
	function priceFor(base) {
		return Math.round(base * (1 + EXTRA_SEAT_FACTOR * (seatsChosen() - 1)));
	}
	// What goes to the Worker: { package, base, label, renewing, per }.
	function chosen() {
		if (kind === "credits") {
			var pack = packs[packIndex];
			if (!pack || pack.prices[size] === null) return null;
			return {
				package: size + "-" + pack.n,
				base: pack.prices[size],
				label: pack.n === 1 ? "1 master credit" : pack.n + " master credits",
				renewing: false,
			};
		}
		var pass = currentPass();
		if (!pass) return null;
		// Renewing: a month or year pass with the box ticked – never for a
		// top-up, where automatic renewal would be a licence of its own.
		var renewing = !topUp && !!pass.renews && !!(renewBox && renewBox.checked);
		return {
			package: renewing ? size + "-" + pass.renews : size + "-" + pass.slug,
			base: pass.prices[size],
			label: pass.label + " pass",
			renewing: renewing,
			per: pass.per,
		};
	}

	// ---- Rendering -------------------------------------------------------------------
	function update() {
		// A licence that renews automatically already has its time: only
		// credits can be added to it.
		var noPasses = !!(topUp && topUp.renews);
		if (noPasses) kind = "credits";
		if (sizePicker) markChosen(sizePicker, ".size-option", function (card) { return card.dataset.size === size; });
		if (kindPicker) {
			markChosen(kindPicker, ".kind-option", function (card) { return card.dataset.kind === kind; });
			var timeCard = kindPicker.querySelector('[data-kind="time"]');
			if (timeCard) timeCard.disabled = noPasses;
		}
		if (creditSection) creditSection.hidden = kind !== "credits";
		if (timeSection) timeSection.hidden = kind !== "time";

		// Credits.
		if (slider) {
			var pack = packs[packIndex];
			slider.value = pack.n;
			slider.style.setProperty("--fill", slider.position(pack.n));
			var name = pack.n === 1 ? "1 master credit" : pack.n + " master credits";
			slider.setAttribute("aria-valuetext", name);
			ticks.forEach(function (tick, index) {
				tick.classList.toggle("is-on", index === packIndex);
				tick.setAttribute("aria-label", (packs[index].n === 1 ? "1 credit, " : packs[index].n + " credits, ")
					+ euros(packs[index].prices[size]));
			});
			readout.name.textContent = name;
			readout.sub.textContent = pack.n === 1 ? "One master, for good"
				: euros(pack.prices[size] / pack.n) + " per master";
			readout.price.textContent = euros(pack.prices[size]);
		}

		// Passes.
		var pass = currentPass();
		if (passGrid) {
			Array.prototype.forEach.call(passGrid.querySelectorAll(".pass-option"), function (card) {
				var p = passFor(card.dataset.pass);
				var price = p.prices[size];
				card.disabled = price === null;
				card.querySelector(".choice-price").textContent = price === null
					? p.offeredBy.join(" and ") + " only"
					: euros(price);
			});
			markChosen(passGrid, ".pass-option", function (card) { return pass && card.dataset.pass === pass.slug; });
		}
		// The switch stays on show for every pass (never for a top-up);
		// a pass that can't renew greys it out and says why.
		var canRenew = !!(pass && pass.renews);
		if (renewRow) renewRow.hidden = !!topUp;
		if (renewBox) renewBox.disabled = !canRenew;
		if (renewNote) renewNote.hidden = !canRenew;
		if (renewUnavailable) renewUnavailable.hidden = canRenew;
		if (renewUnit && pass && pass.per) renewUnit.textContent = pass.per;

		// Seats.
		var n = seatsChosen();
		if (seatsValue) seatsValue.textContent = n === 1 ? "1 seat" : n + " seats";
		if (seatsDown) seatsDown.disabled = !!topUp || n <= 1;
		if (seatsUp) seatsUp.disabled = !!topUp || n >= MAX_SEATS;

		// Summary.
		var item = chosen();
		if (sumSize && sizePicker) {
			var sizeCard = sizePicker.querySelector('[data-size="' + size + '"] .choice-name');
			sumSize.textContent = sizeCard ? sizeCard.textContent : size;
		}
		if (sumPackage) sumPackage.textContent = item ? item.label : "–";
		if (sumSeats) sumSeats.textContent = n;
		if (sumRenewRow) sumRenewRow.hidden = !(item && item.renewing);
		if (sumRenew && item && item.per) sumRenew.textContent = item.per === "year" ? "Yearly" : "Monthly";
		// The amount alone: what VAT is added to it is settled on the
		// invoice.
		if (total) total.textContent = item ? euros(priceFor(item.base)) + (item.renewing ? " / " + item.per : "") : "";
		syncSubmit();
	}

	// ---- Details ----------------------------------------------------------------------
	// The VAT ID only matters inside the EU – read off the country list's
	// own "European Union" group, so the list stays the one place it's
	// written.
	function inEU() {
		var option = country && country.selectedOptions[0];
		return !!(option && option.parentNode && option.parentNode.label === "European Union");
	}
	function syncSubmit() {
		if (!submit) return;
		var ready = !!(country && country.value) && !!chosen();
		submit.disabled = !ready || submitting;
		if (!submitting && status && !status.classList.contains("error")) {
			status.textContent = ready ? "" : statusText;
			status.hidden = ready;
		}
	}
	if (country) country.addEventListener("change", function () {
		if (vatRow) vatRow.hidden = !inEU();
		if (vatInput && !inEU()) vatInput.value = "";
		if (status) status.classList.remove("error");
		syncSubmit();
	});

	function show(message, isError) {
		if (!status) return;
		status.textContent = message;
		status.classList.toggle("error", !!isError);
		status.hidden = false;
	}

	// ---- Top-up -------------------------------------------------------------------------
	// Once the buyer has entered a key (or a long code), ask the Worker
	// which licence it is. Its seats then price the order; a renewing
	// licence is offered credits only. Asked when the field settles, not
	// on every keystroke – key lookups are rate-limited.
	// `null` puts the page's own note back, markup and all; any other
	// text – the Worker's messages included – goes in as plain text.
	function setLicenceNote(text, isError) {
		if (!licenceNote) return;
		if (text === null) licenceNote.innerHTML = licenceNoteHTML;
		else licenceNote.textContent = text;
		licenceNote.classList.toggle("error", !!isError);
	}
	function applyTopUp(next) {
		topUp = next;
		update();
	}
	var lookedUp = "";
	var lookupTimer = null;
	function lookUpLicence() {
		var text = licenceInput ? licenceInput.value.trim() : "";
		if (text === lookedUp) return;
		lookedUp = text;
		if (!text) {
			applyTopUp(null);
			setLicenceNote(null, false);
			return;
		}
		setLicenceNote("Looking up your licence…", false);
		fetch(WORKER_URL + "/licence/lookup", {
			method: "POST",
			headers: { "Content-Type": "application/json" },
			body: JSON.stringify({ licence: text }),
		}).then(function (response) {
			return response.json().then(function (data) {
				// A later edit has moved on; this answer is stale.
				if (text !== lookedUp) return;
				if (!response.ok || !data.ok) {
					// Leave the text free to be asked about again – after a
					// wait, or once the buyer has corrected it (or emptied the
					// field, which brings the note back).
					lookedUp = null;
					applyTopUp(null);
					setLicenceNote(data.message || "We couldn’t check that licence. Please try again.", true);
					return;
				}
				applyTopUp({ key: data.key, seats: data.seats, renews: !!data.renews });
				// A top-up is for all the licence's seats; fewer seats are a
				// licence of their own.
				setLicenceNote("Adding to " + (data.key || "your licence") + ", "
					+ data.seats + (data.seats === 1 ? " seat." : " seats.")
					+ (data.renews ? " Its pass renews automatically, so only master credits can be added." : "")
					+ " For a different number of seats, leave the field empty to get a separate licence.",
					false);
			});
		}).catch(function () {
			if (text !== lookedUp) return;
			lookedUp = null;
			setLicenceNote("We couldn’t reach the licence server. Please try again.", true);
		});
	}
	if (licenceInput) {
		licenceInput.addEventListener("input", function () {
			clearTimeout(lookupTimer);
			lookupTimer = setTimeout(lookUpLicence, 600);
		});
		licenceInput.addEventListener("change", function () {
			clearTimeout(lookupTimer);
			lookUpLicence();
		});
		// A value the browser restored on a reload or a step back.
		if (licenceInput.value.trim()) {
			if (topupBox) topupBox.open = true;
			lookUpLicence();
		}
	}

	// ---- Checkout -----------------------------------------------------------------------
	var submitting = false;
	form.addEventListener("submit", function (event) {
		event.preventDefault();
		// Never submit without an explicit country – the VAT handling
		// depends on it.
		if (!country.value) {
			show("Please select your country.", true);
			country.focus();
			return;
		}
		var item = chosen();
		if (!item) return;
		submitting = true;
		submit.disabled = true;
		show("Taking you to the secure payment page…", false);
		fetch(WORKER_URL + "/checkout", {
			method: "POST",
			headers: { "Content-Type": "application/json" },
			body: JSON.stringify({
				// A renewing pass is its own package – a subscription.
				package: item.package,
				seats: seatsChosen(),
				// The Worker resolves the licence again and prices it itself.
				licence: licenceInput ? licenceInput.value.trim() : "",
				company: document.getElementById("order-company").value,
				country: country.value,
				vatId: vatInput && inEU() ? vatInput.value : "",
			}),
		}).then(function (response) {
			return response.json().then(function (data) {
				if (!response.ok || !data.url) throw new Error(data.error || "Something went wrong.");
				// Stripe collects email, name, billing address and the
				// payment itself; the licence key goes out from the
				// Worker the moment the payment lands.
				window.location.href = data.url;
			});
		}).catch(function (error) {
			submitting = false;
			show(error.message || "Something went wrong. Please try again.", true);
			syncSubmit();
		});
	});
	// Coming back from Stripe with the back button restores the page from
	// the cache, mid-submit.
	window.addEventListener("pageshow", function (event) {
		if (!event.persisted) return;
		submitting = false;
		if (status) status.classList.remove("error");
		update();
	});

	// ---- Links to #credits and #time open their option ----------------------------------
	function openForHash() {
		var id = location.hash.replace(/^#/, "");
		if (id !== "credits" && id !== "time") return;
		if (id === "time" && topUp && topUp.renews) return;
		kind = id;
		update();
		// main.js (on load) and the browser (on a hashchange) scroll to the
		// heading while its section may still have been hidden; take the
		// scroll again now it's on show.
		requestAnimationFrame(function () {
			var target = document.getElementById(id);
			if (target) target.scrollIntoView();
		});
	}
	window.addEventListener("hashchange", openForHash);

	// A country the browser restored on a reload or a step back.
	if (vatRow) vatRow.hidden = !inEU();
	update();
	openForHash();
});
</script>
</body>
</html>
