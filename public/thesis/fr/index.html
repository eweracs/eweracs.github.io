var WRONG = "Mot de passe incorrect.";
var OLD = "Cette page requiert un navigateur récent (Chrome, Firefox ou Safari à partir de 2023).";
var WORKING = "Déchiffrement…";

function bytes(b64) {
  var s = atob(b64), a = new Uint8Array(s.length);
  for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i);
  return a;
}

async function unlock(pw) {
  var enc = new TextEncoder();
  var km = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  var key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: bytes(SALT), iterations: ITER, hash: 'SHA-256' },
    km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(IV) }, key, bytes(DATA));
  var stream = new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'));
  var html = await new Response(stream).text();
  sessionStorage.setItem('tc_pw', pw);
  document.open();
  document.write(html);
  document.close();
}

var form = document.getElementById('f');
var input = document.getElementById('pw');
var go = document.getElementById('go');
var err = document.getElementById('err');

if (!window.crypto || !crypto.subtle || typeof DecompressionStream === 'undefined') {
  err.textContent = OLD;
  go.disabled = true;
}

form.addEventListener('submit', function (ev) {
  ev.preventDefault();
  err.textContent = WORKING;
  go.disabled = true;
  setTimeout(function () {
    unlock(input.value).catch(function () {
      err.textContent = WRONG;
      go.disabled = false;
      input.select();
    });
  }, 30);
});

var saved = sessionStorage.getItem('tc_pw');
if (saved) {
  err.textContent = WORKING;
  unlock(saved).catch(function () {
    sessionStorage.removeItem('tc_pw');
    err.textContent = '';
  });
}
</script>
