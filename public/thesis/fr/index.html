  label { display: block; font-size: 0.65em; color: #717182; margin-bottom: 0.5em; }
  input { width: 100%; box-sizing: border-box; font: inherit; padding: 0.45em 0.6em;
          background: #f3f3f5; border: 1px solid transparent; border-radius: 0.625rem;
          margin-bottom: 0.8em; color: inherit; }
  input:focus { outline: none; border-color: rgba(0, 0, 0, 0.25); }
  button { font: inherit; font-size: 0.8em; font-variation-settings: "wght" 500;
           background: #030213; color: #ffffff; border: none; border-radius: 0.625rem;
           padding: 0.5em 1.1em; cursor: pointer; transition: all 0.1s ease-in-out; }
  button:hover { font-synthesis: none; font-variation-settings: "wght" 700; }
  button:disabled { opacity: .5; cursor: default; }

</style>

  var km = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  var key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: bytes(SALT), iterations: ITER, hash: 'SHA-256' },
    km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(IV) }, key, bytes(DATA));
  var stream = new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'));
  var html = await new Response(stream).text();
  sessionStorage.setItem('tc_pw', pw);
  document.open();
  document.write(html);
  document.close();
}

var form = document.getElementById('f');
var input = document.getElementById('pw');
var go = document.getElementById('go');
var err = document.getElementById('err');

if (!window.crypto || !crypto.subtle || typeof DecompressionStream === 'undefined') {
  err.textContent = OLD;
  go.disabled = true;
}

form.addEventListener('submit', function (ev) {
  ev.preventDefault();
  err.textContent = WORKING;
  go.disabled = true;
  setTimeout(function () {
    unlock(input.value).catch(function () {
      err.textContent = WRONG;
      go.disabled = false;
      input.select();
    });
  }, 30);
});

var saved = sessionStorage.getItem('tc_pw');
if (saved) {
  err.textContent = WORKING;
  unlock(saved).catch(function () {
    sessionStorage.removeItem('tc_pw');
    err.textContent = '';
  });
}
</script>
</body>
</html>
